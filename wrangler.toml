# 适配 Cloudflare 默认 Deploy command: npx wrangler deploy
# （Workers + Static Assets；反代在 workers/site.ts）

name = "dandanhub"
main = "workers/site.ts"
compatibility_date = "2024-11-12"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
